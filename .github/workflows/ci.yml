name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  release-build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  fidelity-replay:
    name: differential fidelity (offline replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Replays the SQL corpus and Firehose artifact scenarios against glaux
      # and diffs them with the checked-in snapshots. No AWS access needed;
      # `cargo run -p glaux-fidelity -- record --profile <p>` refreshes the
      # snapshots against real Athena.
      - run: cargo run -p glaux-fidelity -- replay

  license-boundary:
    name: fakecloud dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ci/check-no-fakecloud-deps.sh

  flagship-pipeline:
    name: flagship pipeline (EventBridge → SQS → Firehose → Parquet → Athena)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Rust integration test drives the pipeline over the wire against
      # the all-in-one `glaux` binary, with a fakecloud process for the
      # EventBridge hop (downloaded from GitHub releases by the test itself).
      # GLAUX_REQUIRE_FAKECLOUD turns "fakecloud unavailable" from a skip
      # into a failure so CI can never go green by skipping.
      - run: cargo test -p glaux --test flagship_pipeline_it -- --nocapture
        env:
          GLAUX_REQUIRE_FAKECLOUD: "1"
      # The same flow as a shell script over the AWS CLI — what the README
      # demo and the release gate run.
      - run: examples/flagship-pipeline.sh
        env:
          GLAUX_BIN: target/debug/glaux
