[package]
name = "glaux"
description = "All-in-one glaux binary: fakecloud control plane plus real Athena and Firehose data plane on one port"
license = "AGPL-3.0-only"
# The AGPL all-in-one binary is distributed as release tarballs and images only.
publish = false
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
glaux-athena = { workspace = true }
glaux-catalog = { workspace = true }
glaux-firehose = { workspace = true }

# fakecloud is pinned to an exact version: its crates expose internal state
# types (S3State, GlueAccounts, ...) that glaux's in-process backends read
# directly, so any upgrade must be reviewed against those types. See
# README.md ("Upgrading fakecloud") for the procedure.
fakecloud-core = "=0.44.10"
fakecloud-persistence = "=0.44.10"
fakecloud-s3 = "=0.44.10"
fakecloud-glue = "=0.44.10"
fakecloud-sqs = "=0.44.10"
fakecloud-sns = "=0.44.10"
fakecloud-iam = "=0.44.10"
fakecloud-ssm = "=0.44.10"
fakecloud-secretsmanager = "=0.44.10"
fakecloud-kms = "=0.44.10"
fakecloud-logs = "=0.44.10"

async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
datafusion = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
object_store = { workspace = true }
parking_lot = "0.12"
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
arrow = { workspace = true }
base64 = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
reqwest = { workspace = true, features = ["blocking"] }
