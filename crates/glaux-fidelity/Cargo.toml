[package]
name = "glaux-fidelity"
description = "Differential fidelity suite: records the SQL corpus against real Athena and replays it offline against glaux"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "glaux-fidelity"
path = "src/main.rs"

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sdk-athena = { workspace = true }
aws-sdk-glue = { workspace = true }
aws-sdk-s3 = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
datafusion = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
glaux-athena = { workspace = true }
glaux-catalog = { workspace = true }
glaux-firehose = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
serde_json = { workspace = true }
sqlparser = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
