[package]
name = "glaux-firehose"
description = "Firehose-compatible API and real delivery engine: buffering, S3 prefix semantics, and JSON-to-Parquet format conversion"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
glaux-catalog = { workspace = true }
parquet = { workspace = true, features = ["arrow", "snap", "flate2"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
object_store = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-firehose = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
