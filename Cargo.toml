[workspace]
resolver = "2"
members = [
    "crates/glaux-athena",
    "crates/glaux-firehose",
    "crates/glaux-catalog",
    "crates/glaux-server",
    "crates/glaux",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/liorknafo/glaux"
rust-version = "1.90"

[workspace.dependencies]
# Internal crates
glaux-athena = { path = "crates/glaux-athena", version = "0.1.0" }
glaux-firehose = { path = "crates/glaux-firehose", version = "0.1.0" }
glaux-catalog = { path = "crates/glaux-catalog", version = "0.1.0" }

# Async runtime & HTTP
tokio = { version = "1.53", features = ["full"] }
axum = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Query engine stack (arrow/object_store/sqlparser pinned to the versions
# DataFusion 55 links against, so traits stay compatible across crates)
datafusion = "55"
datafusion-datasource = "55"
arrow = "59.2"
object_store = "0.13"
sqlparser = "0.62"

# AWS request signing (SigV4 for the lightweight Glue client; the full
# aws-sdk-glue stack is deliberately avoided — see glaux-catalog docs)
aws-credential-types = "1"
aws-sigv4 = "1"
aws-smithy-runtime-api = "1"

# HTTP client (rustls only, matching object_store's TLS stack)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
http = "1"

# Utilities
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
bytes = "1"
futures = "0.3"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

# Test-only helpers (referenced from crate dev-dependencies)
parquet = "59.2"
tempfile = "3"
aws-sdk-athena = "1"
csv = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Analytics workloads benefit from full optimization; keep debuginfo out of
# release artifacts.
debug = false
